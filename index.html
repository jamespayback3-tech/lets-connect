<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Connect 💬</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#6a11cb,#2575fc);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:400px;border-radius:24px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
.logo{font-size:50px}
h1{font-size:28px;margin:5px 0}
p.sub{color:#666;font-size:14px;margin-bottom:20px}
input{width:100%;padding:14px;border:2px solid #eee;border-radius:12px;margin-bottom:12px;font-size:15px;outline:none}
input:focus{border-color:#6a11cb}
button{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.link{margin-top:15px;font-size:14px;color:#6a11cb;cursor:pointer;font-weight:600}
#msg{margin-top:12px;font-size:13px;min-height:18px}
.success{color:green}.error{color:red}
#dashboard{display:none}
.avatar{width:70px;height:70px;background:linear-gradient(135deg,#6a11cb,#2575fc);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin:0 auto 10px}
.kim{position:fixed;bottom:20px;right:20px;background:#fff;border-radius:50px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:700;cursor:pointer;z-index:10}
</style>
</head>
<body>

<div class="card" id="authCard">
  <div class="logo">💬</div>
  <h1>Let's Connect</h1>
  <p class="sub" id="subtitle">Create your account to chat with Kim AI ✨</p>
  <input id="email" type="email" placeholder="Email address">
  <input id="username" type="text" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button id="mainBtn" onclick="handleAuth()">CREATE ACCOUNT</button>
  <div class="link" id="toggleLink" onclick="toggleMode()">Already have an account? Login</div>
  <div id="msg"></div>
  <p style="font-size:11px;color:#999;margin-top:15px">Day 2 - Real Login with Supabase ✅</p>
</div>

<div class="card" id="dashboard">
  <div class="avatar">👤</div>
  <h1 id="welcomeText">Welcome!</h1>
  <p class="sub" id="userEmail"></p>
  <p style="background:#f0eaff;padding:15px;border-radius:12px;margin:15px 0">🎉 You are logged in!<br>Your account is saved in Supabase.<br><br>Day 3: We add Chat + Kim AI 💬</p>
  <button onclick="logout()">LOG OUT</button>
</div>

<div class="kim" onclick="alert('✨ Hi! I am Kim AI. Day 3 I will start chatting with you!')">✨ Kim AI</div>
